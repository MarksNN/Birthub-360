<!doctype html>
<html lang="pt-BR">

<head><script>window.process = { env: {} };</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Cor inicial do tema light oficial; ThemeProvider acompanha a alternância. -->
  <meta name="theme-color" content="#F4F7FB" />
  <meta name="description"
    content="Birth Hub 360° conecta dados, inteligência artificial, CRM, automação e execução comercial em um único centro de comando." />

         do emblema vira ruído. Ver identidade-visual/birthhub360/README.md. -->
  <link rel="icon" type="image/svg+xml" href="/brand/birthhub360-icone.svg" />
  <title>Birth Hub 360° | Commercial Intelligence & Execution Platform</title>
  <!-- Fontes oficiais arredondadas (Plus Jakarta Sans, Nunito, Outfit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300..900;1,300..900&family=Outfit:wght@300..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet" />
  <!-- Fontes oficiais self-hosted são carregadas por globals.css. -->
  <script>
    document.documentElement.classList.remove("dark");
    document.documentElement.classList.add("light");
    document.documentElement.dataset.theme = "light";
  </script>
</head>
