# Configuração Nginx oficial para Birth Hub 360
# Suporta roteamento SPA (fallback com try_files para evitar 403/500 em F5 e links diretos)
# e proxy reverso para backend Node.js.

server {
    listen 80;
    server_name _;

    # Raiz dos arquivos estáticos compilados do Vite
    root /home/ubuntu/birthhub-360/dist;
    index index.html;

    # Headers de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Fallback SPA: permite recarregamento (F5) e acesso direto por link sem retornar erro 403/500
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para APIs Node.js
    location /api/ {
        proxy_pass http://localhost:3024;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Suporte a WebSocket
    location /ws {
        proxy_pass http://localhost:3024;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
