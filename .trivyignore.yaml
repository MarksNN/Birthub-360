# Waivers para o gate de PR do Trivy (.github/workflows/security-trivy.yml, job
# `trivy-fs-pr-gate`) e para o scan de imagem em produção (.github/workflows/production.yaml).
#
# Fonte de verdade única de POR QUÊ um advisory é aceito, dono e data de reavaliação:
# docs/security/AUDIT_WAIVERS.md ("## Waivers ativos"). Este arquivo só espelha o(s) mesmo(s)
# advisory ID(s) no formato que o Trivy entende, com o `expired_at` correspondente — quando
# `docs/security/AUDIT_WAIVERS.md` mudar (nova entrada, expiração, remoção), atualize este arquivo
# na mesma alteração. `expired_at` vencido faz o Trivy voltar a reportar o achado normalmente
# (fail-closed automático, não depende de revisão manual notar a data vencida).
vulnerabilities:
  - id: GHSA-27R3-JXMH-P828
    expired_at: 2026-11-30
    statement: >-
      body-parser high vulnerability, see AUDIT_WAIVERS.md
  - id: GHSA-4QV8-2P9J-2685
    expired_at: 2026-11-30
    statement: >-
      undici high vulnerability, see AUDIT_WAIVERS.md
  - id: GHSA-XJJ6-F33Q-929C
    expired_at: 2026-11-30
    statement: >-
      undici high vulnerability, see AUDIT_WAIVERS.md
  - id: GHSA-ggr8-5vv4-36mx
    statement: >-
      deepmerge-ts <8.0.0 via prisma/@prisma/config (carregamento de prisma.config.ts, ferramenta
      de build/CLI — não processa entrada não confiável em runtime da aplicação). Aceito
      temporariamente porque o único fix automático rebaixaria o Prisma de uma major para outra.
      Ver docs/security/AUDIT_WAIVERS.md para o detalhamento completo e o dono do waiver.
    expired_at: 2026-10-11
  # Mesma vulnerabilidade que GHSA-ggr8-5vv4-36mx acima (mesmo pacote deepmerge-ts, mesma cadeia
  # via prisma/@prisma/config, mesmo texto de advisory "stack exhaustion when merging recursive
  # object graphs") — só indexada por ID diferente na base do Trivy (CVE, não GHSA). Confirmado
  # rodando `trivy fs` localmente contra este repositório em 2026-08-25 (ver PR #269): sem esta
  # entrada, o Trivy reporta HIGH em package-lock.json mesmo com o waiver GHSA já presente acima,
  # porque o Trivy casa por ID exato, não por pacote/descrição.
  - id: CVE-2026-40345
    statement: >-
      Mesma vulnerabilidade de GHSA-ggr8-5vv4-36mx (deepmerge-ts <8.0.0 via prisma/@prisma/config),
      só sob o ID que o Trivy usa para ela. Ver docs/security/AUDIT_WAIVERS.md para o
      detalhamento completo e o dono do waiver.
    expired_at: 2026-10-11

