sonar.projectKey=MarksNN_Birthub-360
sonar.organization=marcelinmark26359876123123
sonar.projectName=Birthub 360
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Defaults to .
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.ts,**/*.test.tsx,**/__tests__/**

# Coverage
# Precisa bater com `coverage.reportsDirectory` de vitest.unit.config.ts (o config que
# .github/workflows/sonarqube.yml realmente roda via `npm run test:unit -- --coverage`), não com
# o vitest.config.ts da raiz (usado só pelos testes do Storybook, reportsDirectory diferente).
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info
# MONTAR_CONTEXT.py não entra no LCOV do Vitest. O workflow do Sonar gera este
# Cobertura com scripts/ci/cover-montar-context.py antes do scan.
sonar.python.coverage.reportPaths=coverage/python/coverage.xml

# Encoding
sonar.sourceEncoding=UTF-8

# SCA: o CI e a producao instalam com `npm ci` a partir de package-lock.json.
# pnpm-lock.yaml e um espelho secundario (overrides em pnpm-workspace.yaml) para
# quem usa pnpm localmente e para o Trivy. Os dois lockfiles no mesmo diretorio
# fazem o coletor SCA abortar. A exclusao abaixo tira somente o lockfile que o
# Sonar nao instala. package-lock.json, landing/ e agente-codigo-local/ continuam
# na analise. Nao usar sonar.sca.allowRedundantLockfiles.
sonar.sca.exclusions=pnpm-lock.yaml
