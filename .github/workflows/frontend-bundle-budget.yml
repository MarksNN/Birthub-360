name: Frontend Bundle Budget

# ITEM-15 (remediacao de divida tecnica): impede regressao silenciosa de tamanho do bundle JS/CSS
# que o navegador baixa para carregar a aplicacao React. Complementar ao ITEM-05
# (.github/workflows/public-assets-budget.yml), que cobre datasets/assets estaticos em `public/`
# — este workflow cobre o que o Vite realmente processa e faz code-split em `dist/assets/`.
# Ver scripts/ci/check-bundle-budget.mjs e docs/development/PERFORMANCE_BUDGETS.md.
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/ci/check-bundle-budget.mjs'
      - '.github/workflows/frontend-bundle-budget.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/ci/check-bundle-budget.mjs'
      - '.github/workflows/frontend-bundle-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Espelha ci.yml: PR cancela o run anterior da mesma PR; fora de PR, push/schedule/workflow_dispatch
  # (os triggers que este workflow tiver) ficam num grupo por evento+SHA, sem cancelamento.
  group: ${{ github.event_name == 'pull_request' && format('frontend-bundle-budget-pr-{0}', github.event.pull_request.number) || format('frontend-bundle-budget-{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  budget:
    name: Frontend bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build frontend
        run: npx vite build

      - name: Check bundle size budget
        run: npm run check:bundle-budget | tee bundle-budget-report.json

      - name: Upload bundle size trend
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-budget-trend-${{ github.sha }}
          path: bundle-budget-report.json
          retention-days: 90
