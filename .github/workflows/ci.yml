# Workflow canônico de release da aplicação.
# A proteção da main exige o contexto GitHub Actions `build`; por isso esse nome é
# reservado exclusivamente ao agregador final deste workflow.
name: Central Birth Hub 360 Release

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs: cancela o run anterior da mesma PR ao receber um novo push (feedback rápido).
  # push em main/master/develop: fila por SHA sem cancelamento — merges próximos no tempo não
  # podem cancelar a verificação de integração um do outro, ou o estado combinado de main fica
  # sem gate verde confirmado (mesmo modo de falha do incidente da Onda 5, RLS do AILog só
  # visível no gate de integração).
  group: ${{ github.event_name == 'pull_request' && format('central-birthhub360-release-pr-{0}', github.event.pull_request.number) || format('central-birthhub360-release-push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Central Birth Hub 360 / secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks (varredura de segredo versionado)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-review:
    name: Central Birth Hub 360 / dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          allow-ghsas: GHSA-ggr8-5vv4-36mx, GHSA-Q2HR-2G5M-VWHR, GHSA-QHR7-859C-M2P7, GHSA-6J4F-FJ2G-MC7P, GHSA-G57G-F23G-4646, GHSA-V53P-9FQP-M79J, GHSA-PRGH-XP8R-P3M5

  trivy-scan:
    name: Central Birth Hub 360 / trivy scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Rodar Trivy (fs scan, HIGH/CRITICAL, bloqueante)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: sarif
          output: trivy-fs-results.sarif
          trivyignores: .trivyignore.yaml
          limit-severities-for-sarif: true
          skip-files: 'pnpm-lock.yaml,agente-codigo-local/bun.lock'

      - name: Upload SARIF para a aba Security
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

  build-and-test:
    name: Central Birth Hub 360 / application gate
    runs-on: ubuntu-latest
    needs: [secret-scan, trivy-scan]
    if: always() && needs.secret-scan.result == 'success' && needs.trivy-scan.result == 'success'
    # Os runs 36785425846 e 36791581889 completaram os gates anteriores, mas expiraram em 60/90 min
    # enquanto os 100 E2E rodavam serialmente com 1 worker. O último step E2E durou 73m28s sem resumo;
    # 120 min reserva ~103 min após os ~17 min medidos antes dos E2E. Margem operacional, não prova
    # de que a suíte completa passe; o reporter line também expõe progresso no próximo run.
    timeout-minutes: 120

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: prospector
          POSTGRES_PASSWORD: prospector_test_pass
          POSTGRES_DB: prospectordb_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U prospector -d prospectordb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -h 127.0.0.1 ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      meilisearch:
        image: getmeili/meilisearch:v1.12
        env:
          MEILI_MASTER_KEY: ci-test-meili-key
        ports:
          - 7700:7700
        options: >-
          --health-cmd "wget --no-verbose --tries=1 -O - http://127.0.0.1:7700/health >/dev/null 2>&1 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 30s
          --health-retries 12
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://prospector_app:ci_app_test_pass@localhost:5434/prospectordb_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: ci-test-meili-key
      PORT: 3000
      BETTER_AUTH_SECRET: ci-e2e-test-only-secret-not-for-production
      ALLOW_DEV_AUTH_BYPASS: true
      ALLOWED_ORIGINS: http://localhost:3000
      AUTH_RATE_LIMIT_MAX: 500
      PLATFORM_OPERATOR_TOKEN: ci-test-operator-token-not-for-production
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap papel NOSUPERUSER da aplicação
        env:
          PGPASSWORD: prospector_test_pass
          APP_DB_PASSWORD: ci_app_test_pass
        run: bash scripts/db/bootstrap-app-role.sh localhost 5434 prospector prospectordb_test

      - name: Audit for vulnerabilities (waiver-aware)
        run: npm run security:audit-waivers

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Lint
        run: npm run lint:ci

      - name: Run Prettier check
        # Correção da ANALISE-DIVIDA-TECNICA-ROBUSTA.md original (2026-08-28): Prettier já estava
        # configurado (.prettierrc) mas sem script format:check nem gate de CI — rodado
        # `npm run format` uma vez para zerar os 925 arquivos fora do padrão antes de tornar isto
        # bloqueante, para o gate nascer já limpo em vez de falhar o primeiro PR de qualquer um.
        run: npm run format:check

      - name: Verificar working tree limpa após os gates de verificação
        # Nenhum gate de CI (lint, geração do Prisma Client, etc.) deve alterar
        # arquivos versionados. Autofix é um comando local explícito
        # (`npm run lint:fix`), nunca implícito no pipeline. Este passo é uma
        # rede de segurança: se algum gate futuro reintroduzir --fix/autofix (ou
        # outro efeito colateral que escreva no working tree), o CI falha aqui em
        # vez de mascarar a mudança silenciosamente.
        run: |
          if ! git diff --quiet -- . ':!node_modules'; then
            echo "::error::Os gates de verificação alteraram arquivos versionados. O CI deve apenas verificar, nunca corrigir automaticamente. Rode 'npm run lint:fix' localmente e commite o resultado."
            git diff --stat -- . ':!node_modules'
            exit 1
          fi

      - name: Run Type Check
        run: npm run typecheck

      - name: Architecture tests (fronteiras de dependência e hotspots)
        run: npm run test:architecture

      - name: Verificar deriva de OpenAPI
        run: npm run verify:openapi-drift

      - name: Run Unit Tests
        run: npm run test:unit -- --coverage

      - name: Run AI Resilience Tests (TD-009)
        run: npm run test:unit -- src/lib/ai/gateway/__tests__/http-client.test.ts src/lib/ai/gateway/__tests__/circuit-breaker.test.ts src/lib/ai/gateway/__tests__/retry.test.ts

      - name: Run Migrations (para testes de integração)
        run: npx prisma migrate deploy

      - name: Golden Dataset live regression gate
        if: ${{ env.GROQ_API_KEY != '' || env.OPENAI_API_KEY != '' }}
        env:
          GOLDEN_EVAL_USE_LLM_JUDGE: 'true'
        run: npm run eval:golden

      - name: Verificar deriva de schema/migration (DATA-007, não-bloqueante)
        # Compara o banco recém-migrado (todas as migrations de prisma/migrations aplicadas, passo
        # acima) contra o datamodel de prisma/schema.prisma. Um diff não-vazio (--exit-code sai com
        # 2) significa que schema.prisma foi alterado sem uma migration correspondente sendo
        # gerada — exatamente a classe de drift que produziu DATA-007 (commit bf9489fe, 2026-09-19:
        # organizationId/tenantId virou NOT NULL em seis models sem nenhuma migration). Ver
        # docs/audits/repository-debt-audit/DELTA-2026-09-20.md seção 3.
        #
        # continue-on-error: rodando isso contra o estado real do repo, o diff já acusa uma
        # quantidade grande de drift ESTRUTURAL pré-existente e não relacionado a nenhum PR
        # específico (índices renomeados por truncamento de identificador de 63 bytes do Postgres,
        # a tabela KnowledgeChunk removida por migration mas ainda declarada em schema.prisma,
        # etc.) — como gate bloqueante, isso derruba o application gate de TODO PR/push no
        # repositório, não só de quem de fato introduziu drift novo. Mantido como passo visível
        # (aparece no log/step summary de cada run) até essa dívida estrutural ser resolvida à
        # parte; script continua disponível via `npm run verify:migration-drift` para uso manual.
        run: npm run verify:migration-drift
        continue-on-error: true

      - name: Criar .env.test para os testes de integração e E2E
        run: |
          cat > .env.test <<EOF
          NODE_ENV=$NODE_ENV
          PORT=$PORT
          DATABASE_URL=$DATABASE_URL
          REDIS_URL=$REDIS_URL
          MEILI_HOST=$MEILI_HOST
          MEILI_MASTER_KEY=$MEILI_MASTER_KEY
          BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET
          ALLOWED_ORIGINS=$ALLOWED_ORIGINS
          AUTH_RATE_LIMIT_MAX=$AUTH_RATE_LIMIT_MAX
          PLATFORM_OPERATOR_TOKEN=$PLATFORM_OPERATOR_TOKEN
          EOF

      - name: Run Integration Tests (auth, RBAC and tenant isolation)
        run: npm run test:integration -- --coverage

      - name: Run Build
        run: npm run build

      - name: Smoke test do build de produção (/health/live, /health/ready, /health/version)
        env:
          PORT: 3024
          NODE_ENV: test
          ALLOW_DEV_AUTH_BYPASS: true
        run: |
          node dist/server.cjs &
          SERVER_PID=$!
          echo "Aguardando boot do servidor de produção (PID $SERVER_PID)..."
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3024/health/live >/dev/null 2>&1; then
              echo "Servidor online após ${i}s."
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3024/health/live || { echo "Falha em /health/live"; kill -9 $SERVER_PID 2>/dev/null || true; exit 1; }
          curl -fsS http://127.0.0.1:3024/health/ready || { echo "Falha em /health/ready"; kill -9 $SERVER_PID 2>/dev/null || true; exit 1; }
          curl -fsS http://127.0.0.1:3024/health/version || { echo "Falha em /health/version"; kill -9 $SERVER_PID 2>/dev/null || true; exit 1; }
          echo "Smoke test de produção aprovado!"
          kill -15 $SERVER_PID 2>/dev/null || true

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
        if: failure()

      - name: Upload coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-reports
          path: coverage/
        if: always()

      - name: Publicar diagnóstico da aplicação
        if: failure()
        run: |
          {
            echo "## Application gate failed"
            echo "A falha ocorreu em um dos passos acima (testes, lint, build). Verifique os logs."
          } >> $GITHUB_STEP_SUMMARY

  # Este é o único job que deve publicar o contexto `build` exigido pela branch protection.
  # O if: always() transforma falha/cancelamento das dependências em FAIL explícito em vez de
  # deixar o required check ausente.
  build:
    name: build
    if: always() && github.event_name != 'workflow_dispatch'
    needs: [secret-scan, dependency-review, trivy-scan, build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Consolidar veredito do repositório
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          TRIVY_SCAN_RESULT: ${{ needs.trivy-scan.result }}
          APPLICATION_GATE_RESULT: ${{ needs.build-and-test.result }}
        run: |
          set -euo pipefail
          printf 'secret-scan=%s\n' "$SECRET_SCAN_RESULT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            printf 'dependency-review=%s\n' "$DEPENDENCY_REVIEW_RESULT"
          fi
          printf 'trivy-scan=%s\n' "$TRIVY_SCAN_RESULT"
          printf 'application-gate=%s\n' "$APPLICATION_GATE_RESULT"
          test "$SECRET_SCAN_RESULT" = success
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$DEPENDENCY_REVIEW_RESULT" = success
          fi
          test "$TRIVY_SCAN_RESULT" = success
          test "$APPLICATION_GATE_RESULT" = success

  # Geração manual de baselines Linux. Não participa do required check `build`.
  visual-baselines:
    name: 'Gerar baselines visuais Linux (manual)'
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: prospector
          POSTGRES_PASSWORD: prospector_test_pass
          POSTGRES_DB: prospectordb_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U prospector -d prospectordb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -h 127.0.0.1 ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      meilisearch:
        image: getmeili/meilisearch:v1.12
        env:
          MEILI_MASTER_KEY: ci-test-meili-key
        ports:
          - 7700:7700
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:7700/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://prospector_app:ci_app_test_pass@localhost:5434/prospectordb_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: ci-test-meili-key
      PORT: 3000
      BETTER_AUTH_SECRET: ci-e2e-test-only-secret-not-for-production
      ALLOW_DEV_AUTH_BYPASS: true
      ALLOWED_ORIGINS: http://localhost:3000
      AUTH_RATE_LIMIT_MAX: 500
      PLATFORM_OPERATOR_TOKEN: ci-test-operator-token-not-for-production

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap papel NOSUPERUSER da aplicação
        env:
          PGPASSWORD: prospector_test_pass
          APP_DB_PASSWORD: ci_app_test_pass
        run: bash scripts/db/bootstrap-app-role.sh localhost 5434 prospector prospectordb_test

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Criar .env.test para os testes E2E
        run: |
          cat > .env.test <<EOF
          NODE_ENV=$NODE_ENV
          PORT=$PORT
          DATABASE_URL=$DATABASE_URL
          REDIS_URL=$REDIS_URL
          MEILI_HOST=$MEILI_HOST
          MEILI_MASTER_KEY=$MEILI_MASTER_KEY
          BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET
          ALLOWED_ORIGINS=$ALLOWED_ORIGINS
          AUTH_RATE_LIMIT_MAX=$AUTH_RATE_LIMIT_MAX
          PLATFORM_OPERATOR_TOKEN=$PLATFORM_OPERATOR_TOKEN
          EOF

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Gerar baselines *-chromium-linux.png
        run: npm run test:visual:update

      - name: Upload baselines geradas
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-snapshots-linux
          path: visual-regression/baselines/**/*-chromium-linux.png
          if-no-files-found: error

      - name: Upload Playwright report (se falhar)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-baselines-playwright-report
          path: visual-regression-report/
        if: failure()
