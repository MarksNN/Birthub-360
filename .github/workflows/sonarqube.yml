name: SonarQube Analysis

# Pipeline oficial de análise de qualidade estática e cobertura do Birthub 360 no SonarQube Cloud.
# Organização: Marks (vars.SONAR_ORGANIZATION = marcelinmark26359876123123)
# Projeto: Birthub 360 (vars.SONAR_PROJECT_KEY = MarksNN_Birthub-360)
# Autenticação: secrets.SONAR_TOKEN
# Validação obrigatória pré-scan: scripts/ci/validate-sonarqube-config.mjs

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('sonarqube-pr-{0}', github.event.pull_request.number) || format('sonarqube-{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonarcloud:
    name: SonarQube
    runs-on: ubuntu-latest
    env:
      # Credencial ausente deve reprovar o check, nunca transformar scan ignorado em verde.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      # Sem isso, src/config/env.ts (importado por src/lib/prisma.ts, que quase todo teste unitário
      # acaba puxando) falha a validação do zod por falta de NODE_ENV e chama process.exit(1) — o
      # que derruba o processo do Vitest inteiro antes de qualquer teste rodar. production.yaml já
      # seta isso pro job build-and-test; este workflow ficou de fora dessa correção.
      NODE_ENV: test
      DATABASE_URL: postgresql://prospector_app:ci_app_test_pass@localhost:5434/prospectordb_test?schema=public
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      BETTER_AUTH_SECRET: ci-e2e-test-only-secret-not-for-production
    steps:
      - name: Validate SonarQube configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN is required. The scanner and quality gate cannot be skipped."
            exit 1
          fi
          case "$SONAR_HOST_URL" in
            https://sonarcloud.io|https://sonarcloud.io/|https://sonarqube.us|https://sonarqube.us/)
              if [ -z "${SONAR_ORGANIZATION:-}" ]; then
                echo "::error::Set the SONAR_ORGANIZATION repository variable to the verified SonarQube Cloud organization key."
                exit 1
              fi
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Validate SonarQube Configuration
        run: node scripts/ci/validate-sonarqube-config.mjs
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork == true && 'true' || 'false' }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests with Coverage
        run: npm run test:unit -- --coverage

      - name: Python coverage for MONTAR_CONTEXT
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/sonar-py"
          "$RUNNER_TEMP/sonar-py/bin/pip" install --disable-pip-version-check coverage
          "$RUNNER_TEMP/sonar-py/bin/coverage" run --branch --source=src/features/intelligence/commercial-v3/assets/07_RUNTIME scripts/ci/cover-montar-context.py
          mkdir -p coverage/python
          "$RUNNER_TEMP/sonar-py/bin/coverage" xml -o coverage/python/coverage.xml
          test -s coverage/python/coverage.xml

      - name: SonarQube Scan
        id: sonar_scan
        uses: SonarSource/sonarqube-scan-action@ad8210318ac8bb816e41990d5af2b304f7a6c213 # master (snapshot fixado em SHA — política de branch protection exige commit SHA completo, não branch)
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            "-Dsonar.organization=${{ env.SONAR_ORGANIZATION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any

      - name: Report SonarQube Quality Gate Status
        if: always() && steps.sonar_scan.outcome != 'skipped'
        run: node scripts/ci/report-sonarqube-qualitygate.mjs
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'MarksNN_Birthub-360' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}
