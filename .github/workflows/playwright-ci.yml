name: E2E Playwright Tests

# Diagnóstico sob demanda. O gate canônico ci.yml já executa esta suíte E2E completa em push/PR.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: prospector
          POSTGRES_PASSWORD: prospector_test_pass
          POSTGRES_DB: prospectordb_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://prospector_app:ci_app_test_pass@localhost:5434/prospectordb_test?schema=public
      DIRECT_URL: postgresql://prospector_migrator:ci_migrator_test_pass@localhost:5434/prospectordb_test?schema=public
      REDIS_URL: redis://localhost:6379
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: ci-test-meili-key
      BETTER_AUTH_SECRET: ci-e2e-test-only-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
      ALLOW_DEV_AUTH_BYPASS: true
      ALLOWED_ORIGINS: http://localhost:3000
      AUTH_RATE_LIMIT_MAX: 500
      PLATFORM_OPERATOR_TOKEN: ci-test-operator-token-not-for-production

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Bootstrap papel NOSUPERUSER da aplicação
      env:
        PGPASSWORD: prospector_test_pass
        APP_DB_PASSWORD: ci_app_test_pass
        MIGRATOR_DB_PASSWORD: ci_migrator_test_pass
      run: bash scripts/db/bootstrap-app-role.sh localhost 5434 prospector prospectordb_test

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Criar .env.test para o E2E
      run: |
        cat > .env.test <<EOF
        NODE_ENV=$NODE_ENV
        PORT=$PORT
        DATABASE_URL=$DATABASE_URL
        DIRECT_URL=$DIRECT_URL
        REDIS_URL=$REDIS_URL
        MEILI_HOST=$MEILI_HOST
        MEILI_MASTER_KEY=$MEILI_MASTER_KEY
        BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET
        BETTER_AUTH_URL=$BETTER_AUTH_URL
        ALLOW_DEV_AUTH_BYPASS=$ALLOW_DEV_AUTH_BYPASS
        ALLOWED_ORIGINS=$ALLOWED_ORIGINS
        AUTH_RATE_LIMIT_MAX=$AUTH_RATE_LIMIT_MAX
        PLATFORM_OPERATOR_TOKEN=$PLATFORM_OPERATOR_TOKEN
        EOF

    - name: Run E2E Tests
      run: npm run test:e2e

    - name: Upload Playwright Report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
