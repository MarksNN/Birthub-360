name: Build iOS App

on:
  # Mobile é artefato sob demanda. O gate automático canônico vive em ci.yml.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: iOS / quality gate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run Type Check
      run: npx tsc --noEmit

    - name: Run Lint
      run: npm run lint:ci

    - name: Run Unit Tests
      run: npm run test:unit

  ios-build:
    name: iOS / archive
    runs-on: macos-latest
    needs: gate

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Web App
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync ios

    - name: Build iOS App (Archive)
      working-directory: ./ios/App
      run: |
        xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' archive -archivePath "$PWD/build/App.xcarchive" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Upload iOS Archive
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: birthhub360-ios-xcarchive
        path: ios/App/build/App.xcarchive
