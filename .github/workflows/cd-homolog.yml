name: CD Homologation

# LOCAL-FIRST: nenhum push em develop pode publicar imagem automaticamente.
# Homologação fica disponível apenas sob ação humana explícita.
#
# Onda 10.2 (PROMPT 10.2 — CI/CD PRODUCTION GATE): mesmo achado e mesma correção de production.yaml
# — este workflow rodava sua própria suíte de testes, mais estreita que ci.yml (sem Prettier, testes
# arquiteturais, deriva de OpenAPI, golden dataset). Substituído por uma exigência explícita de CI
# verde para o SHA informado (job `resolve-sha`, `.github/actions/require-ci-green`) — "NO CI PASS =
# NO DEPLOY" vale para homologação exatamente como para produção.
# DESATIVADO POR ENQUANTO: Plataforma operando estritamente em modo 100% LOCAL-FIRST.
# Homologacao externa/cloud desativada conforme decisao de produto.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA completo (40 chars) já aprovado pelo CI a promover para homologação.'
        required: true
        type: string


# Fica no workflow só o piso comum (nenhum). `contents: write`/`packages: write` só é concedido
# no job `build-and-push` (abaixo), que é o único que de fato empurra imagem/commita Helm — sem
# permissions aqui no nível do workflow, um job sem bloco próprio herda "no access" (padrão do
# GITHUB_TOKEN quando o workflow declara `permissions`), então cada job abaixo declara
# explicitamente só o que precisa (least privilege real, não nominal).
permissions: {}

concurrency:
  # Só uma promoção de homologação por vez (Onda 10.2, secao 18) — evita duas execuções
  # concorrentes commitando em `develop`/`charts/prospector-atlas/values.yaml` ao mesmo tempo.
  group: cd-homolog
  cancel-in-progress: false

jobs:
  resolve-sha:
    name: Validar CI (NO CI PASS = NO DEPLOY)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/require-ci-green
        with:
          sha: ${{ inputs.sha }}
          check-name: build

  build-and-push:
    runs-on: ubuntu-latest
    needs: resolve-sha
    permissions:
      contents: write
      packages: write
      # ITEM-10 (Onda 2): upload do SARIF do scan de imagem (Trivy, abaixo) para a aba Security.
      security-events: write
    steps:
      - name: Checkout repository (SHA já validado pelo CI)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-sha.outputs.sha }}
          fetch-depth: 0

      # ITEM-11 (Onda 3 — SBOM e governança de dependências): todo release real produz um SBOM
      # CycloneDX correlacionável ao commit publicado. Ver docs/security/DEPENDENCY_POLICY.md.
      - name: Use Node.js 22 (para gerar o SBOM)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (para o SBOM)
        run: npm ci --no-audit --no-fund

      - name: Gerar SBOM (CycloneDX)
        run: npm run security:sbom

      - name: Upload do SBOM como artefato do release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ needs.resolve-sha.outputs.sha }}
          path: sbom.cdx.json
          retention-days: 90

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}

      # ITEM-10 (Onda 2 — CodeQL/Trivy/Dependency Review bloqueantes): mesma política do job
      # `publish` de production.yaml — build local (sem push), scan Trivy bloqueante, só então
      # push. Ver comentários equivalentes em production.yaml para o raciocínio completo.
      - name: Build Docker image (local, para scan antes do push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}:${{ needs.resolve-sha.outputs.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — scan da imagem (HIGH/CRITICAL, bloqueante antes do push)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}:${{ needs.resolve-sha.outputs.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy-image-results.sarif
          trivyignores: .trivyignore.yaml

      - name: Upload SARIF do scan de imagem para a aba Security
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image-homolog

      - name: Upload SARIF do scan de imagem como artefato (auditoria/retenção)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-image-sarif-homolog
          path: trivy-image-results.sarif
          retention-days: 30
          if-no-files-found: warn

      - name: Push Docker image (imagem já escaneada)
        run: docker push "ghcr.io/${{ github.repository }}:${{ needs.resolve-sha.outputs.sha }}"

      - name: Update Helm values.yaml with new image tag
        # O workspace está com checkout detached no SHA promovido (validado pelo CI), que pode não
        # ser o tip atual de `develop` — commitar direto em cima dele e tentar `git push origin
        # develop` arriscaria non-fast-forward (ou, pior, sobrescrever histórico se algum dia
        # alguém trocar isto por push --force). Troca explícita para `develop` antes do commit:
        # o bump de tag na Helm chart é um registro de "qual imagem promover", não uma mudança que
        # precisa estar no mesmo commit/branch do código promovido.
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod a+x /usr/local/bin/yq
          git fetch origin develop
          git checkout develop
          git reset --hard origin/develop
          yq e '.image.tag = "${{ needs.resolve-sha.outputs.sha }}"' -i charts/prospector-atlas/values.yaml
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add charts/prospector-atlas/values.yaml
          git commit -m "chore: update image tag to ${{ needs.resolve-sha.outputs.sha }} [skip ci]" || echo "No changes to commit"
          git push origin develop

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Deployment — Birth Hub 360º"
            echo '```'
            echo "ENVIRONMENT............. HOMOLOGATION"
            echo "COMMIT SHA............... ${{ needs.resolve-sha.outputs.sha }}"
            echo "CI QUALITY GATE........... PASS (validado no job resolve-sha antes de qualquer build)"
            echo "ARTIFACT.................. ghcr.io/${{ github.repository }}:${{ needs.resolve-sha.outputs.sha }}"
            echo "ACTOR...................... ${{ github.actor }}"
            echo "TIMESTAMP.................. $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "HELM VALUES.YAML........... atualizado em develop"
            echo "DEPLOYMENT.................. ${{ job.status }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
