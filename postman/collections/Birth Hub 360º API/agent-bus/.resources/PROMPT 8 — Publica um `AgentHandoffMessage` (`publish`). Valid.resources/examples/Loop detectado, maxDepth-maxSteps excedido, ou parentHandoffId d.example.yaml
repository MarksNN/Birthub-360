        "toAgent": "string",
        "toRole": "string",
        "requestType": "string",
        "requestedCapability": "string",
        "resourceScope": {},
        "evidence": [
          {
            "sourceAgent": "string",
            "summary": "string",
            "recordedAt": "string",
            "sourceExecutionId": "string",
            "capabilityCode": "string"
          },
          {
            "sourceAgent": "string",
            "summary": "string",
            "recordedAt": "string",
            "sourceExecutionId": "string",
            "capabilityCode": "string"
          }
        ],
        "priority": "LOW",
        "idempotencyKey": "string",
        "parentHandoffId": "string"
      }
