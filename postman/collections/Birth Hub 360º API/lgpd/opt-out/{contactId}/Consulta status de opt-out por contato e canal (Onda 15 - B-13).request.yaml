url: "{{baseUrl}}/lgpd/opt-out/:contactId?channel=global"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: channel
    value: global
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "global"
          }
        }
      }
pathVariables:
  - key: contactId
    value: string
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
settings: {}
examples: ./.resources/Consulta status de opt-out por contato e canal (Onda 15 - B-13).resources/examples
order: 1000
