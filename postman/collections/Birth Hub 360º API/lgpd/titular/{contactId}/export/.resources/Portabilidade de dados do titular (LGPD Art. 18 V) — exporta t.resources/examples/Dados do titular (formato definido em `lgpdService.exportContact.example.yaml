$kind: http-example
name: Dados do titular (formato definido em `lgpdService.exportContactData`)
request:
  url: "{{baseUrl}}/lgpd/titular/:contactId/export"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    contactId: string
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: "{}"
    $type: |-
      {
        "type": "object"
      }
order: 1000
