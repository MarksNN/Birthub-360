$kind: http-example
request:
  url: "{{baseUrl}}/lgpd/titular/:contactId"
  method: DELETE
  headers:
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    contactId: string
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "string",
        "result": {}
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          },
          "result": {
            "type": "object"
          }
        }
      }
order: 1000
