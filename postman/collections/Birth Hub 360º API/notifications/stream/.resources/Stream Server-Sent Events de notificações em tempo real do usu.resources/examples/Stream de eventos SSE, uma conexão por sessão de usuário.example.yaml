$kind: http-example
request:
  url: "{{baseUrl}}/notifications/stream"
  method: GET
  headers:
    - key: Accept
      value: text/event-stream
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/event-stream
  body:
    type: text
    content: string
    $type: |-
      {
        "type": "string"
      }
order: 1000
