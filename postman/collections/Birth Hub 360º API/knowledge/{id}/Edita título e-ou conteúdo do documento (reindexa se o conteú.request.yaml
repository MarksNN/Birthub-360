$kind: http-request
name: Edita título e/ou conteúdo do documento (reindexa se o conteúdo mudou)
description: ""
url: "{{baseUrl}}/knowledge/:id"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: string
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "title": "string",
      "content": "string"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "title": {
          "type": "string",
          "maxLength": 200
        },
        "content": {
          "type": "string",
          "maxLength": 400000
        }
      }
    }
settings: {}
examples: ./.resources/Edita título e-ou conteúdo do documento (reindexa se o conteú.resources/examples
order: 2000
