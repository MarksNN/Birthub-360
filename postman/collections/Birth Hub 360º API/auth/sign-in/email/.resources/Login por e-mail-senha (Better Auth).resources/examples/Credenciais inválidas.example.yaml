$kind: http-example
request:
  url: "{{baseUrl}}/auth/sign-in/email"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "email": "h29@HxRNczwwiRCEbVBaqjGN.uxu",
        "password": "string"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: ""
order: 2000
