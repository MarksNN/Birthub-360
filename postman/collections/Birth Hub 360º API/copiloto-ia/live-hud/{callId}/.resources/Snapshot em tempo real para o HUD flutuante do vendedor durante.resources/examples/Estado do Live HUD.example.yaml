            "suggestedRebuttal": "string",
            "confidence": 6046.251741547264
          },
          "riskAlert": "string",
          "latencyMs": 7986
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean"
          },
          "data": {
            "type": "object",
            "properties": {
