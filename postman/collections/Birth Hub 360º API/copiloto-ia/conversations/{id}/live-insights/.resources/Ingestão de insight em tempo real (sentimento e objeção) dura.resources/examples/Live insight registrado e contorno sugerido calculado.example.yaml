$kind: http-example
request:
  url: "{{baseUrl}}/copiloto-ia/conversations/:id/live-insights"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "callId": "string",
        "dealId": "string",
        "timestamp": "2024-02-23T12:54:21.445Z",
        "sentimentScore": 0.8583695784570766,
        "objectionCategory": "preco_ou_orcamento",
        "suggestedRebuttal": "string",
        "organizationId": "string",
        "confidence": 0.8898238801350777,
        "competitorMentioned": "string",
        "keyPhrases": [
          "string",
          "string"
        ],
        "transcriptSnippet": "string"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": "",
        "meta": {}
      }
    $type: |-
      {
        "description": "Envelope de resposta genérico usado pela maioria dos endpoints",
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "example": true
          },
          "meta": {
            "type": "object",
            "description": "Presente em listagens paginadas (page, limit, total, etc.)"
          }
        }
      }
order: 1000
