$kind: http-example
request:
  url: "{{baseUrl}}/copiloto-ia/leads/:leadId/deal-health"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    leadId: string
  body:
    type: json
    content: |-
      {
        "score": 5431.192908430128,
        "factorsJson": {}
      }
