$kind: http-example
name: Ator sem JobRole primário ativo, ou sem RoleSupervisorProfile para o cargo (`NO_JOB_ROLE`/`NO_SUPERVISOR_PROFILE`)
request:
  url: "{{baseUrl}}/role-supervisor/run"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "requestedCapability": "string",
        "mission": "string",
        "resource": {},
        "context": {},
        "correlationId": "string"
      }
response:
  statusCode: 409
  statusText: Conflict
  body:
    type: text
    content: ""
order: 3000
