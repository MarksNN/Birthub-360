$kind: http-example
request:
  url: "{{baseUrl}}/market-intelligence/accounts/:id/recommendations/:recommendationId/execute"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    - key: id
      value: string
      disabled: false
      description: Id da Company do CRM do tenant (1–128 chars)
    - key: recommendationId
      value: string
      disabled: false
      description: ""
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "success": false,
          "taskId": "",
          "message": "string"
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "example": true
          },
          "data": {
            "type": "object",
            "properties": {
              "success": {
                "type": "boolean"
              },
              "message": {
                "type": "string"
              }
            }
          }
        }
      }
order: 1000
