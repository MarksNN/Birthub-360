$kind: http-example
name: bitrixUserId ausente, lead sem vínculo Bitrix, ou usuário Bitrix não encontrado
request:
  url: "{{baseUrl}}/mesa-tratamento/lead/:id/reassign"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "bitrixUserId": "string"
      }
response:
  statusCode: 400
  statusText: Bad Request
  body:
    type: text
    content: ""
order: 2000
