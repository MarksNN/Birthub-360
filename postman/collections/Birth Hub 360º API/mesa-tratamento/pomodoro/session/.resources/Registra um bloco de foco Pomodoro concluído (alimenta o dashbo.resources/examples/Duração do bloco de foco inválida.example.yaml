$kind: http-example
request:
  url: "{{baseUrl}}/mesa-tratamento/pomodoro/session"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "durationMinutes": 9692.637492182515,
        "cycleNumber": 6371.957934300701
      }
response:
  statusCode: 400
  statusText: Bad Request
  body:
    type: text
    content: ""
order: 2000
