$kind: http-example
request:
  url: "{{baseUrl}}/feature-flags/:key"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    key: string
  body:
    type: json
    content: |-
      {
        "enabled": false
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "error": "string",
        "message": "string",
        "details": "",
        "code": "SERVICE_UNAVAILABLE",
        "requestId": "string",
        "retryable": false
      }
    $type: |-
      {
        "description": "Envelope de erro padrão, emitido pelo middleware global\n`src/shared/middlewares/errorHandler.ts` (último middleware da cadeia — ver `server.ts`).\n`success`/`error` existem desde a primeira versão da API; `code`, `requestId` e `retryable`\nforam adicionados depois como extensão aditiva (nenhum campo antigo foi removido) para\ncobrir o checklist de contratos do produto. `details` só aparece em alguns casos\n(ex.: `issues` do Zod em erro de validação).\n",
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "example": false
          },
          "error": {
            "type": "string",
            "description": "Mensagem de erro legível, já existente antes da extensão de contrato."
          },
          "message": {
            "type": "string",
            "description": "Reservado no envelope de resposta; não é populado hoje por `errorHandler.ts`."
          },
          "code": {
            "type": "string",
            "enum": [
              "VALIDATION_ERROR",
              "UNAUTHORIZED",
              "FORBIDDEN",
              "NOT_FOUND",
              "METHOD_NOT_ALLOWED",
              "CONFLICT",
              "GONE",
              "UNSUPPORTED_MEDIA_TYPE",
              "UNPROCESSABLE_ENTITY",
              "RATE_LIMITED",
              "INTERNAL_ERROR",
              "BAD_GATEWAY",
              "SERVICE_UNAVAILABLE",
              "TIMEOUT",
              "BAD_REQUEST"
            ],
            "description": "Código estável de erro, derivado do status HTTP e do tipo de erro já lançado no\ncódigo (ZodError, `AppError`, `Prisma.PrismaClientKnownRequestError`). Pensado para o\nconsumidor decidir programaticamente sem parsear `error`.\n"
          },
          "requestId": {
            "type": "string",
            "description": "Mesmo id de correlação devolvido no header `x-request-id` (ver\n`src/shared/middlewares/observability.ts`) — não é gerado de novo aqui, é o mesmo\nvalor reaproveitado. Ausente quando o erro ocorre antes de `observabilityMiddleware`\nrodar na cadeia de middlewares (ex.: falha em rota de auth/webhook montada antes dele).\n"
          },
          "retryable": {
            "type": "boolean",
            "description": "`true` para 5xx e timeouts (408/504) — falha transitória do servidor/upstream, repetir\na mesma requisição pode funcionar. `false` para os demais 4xx (validação, autenticação,\nautorização, conflito, não encontrado) — o pedido em si precisa mudar antes de repetir.\n"
          }
        },
        "required": [
          "success",
          "error"
        ]
      }
order: 2000
