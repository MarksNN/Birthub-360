$kind: http-example
request:
  url: "{{baseUrl}}/feature-flags"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "data": [
          {
            "key": "bug_report_module",
            "description": "string",
            "enabled": false,
            "isOverridden": true
          },
          {
            "key": "bug_report_module",
            "description": "string",
            "enabled": true,
            "isOverridden": true
          }
        ]
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean"
          },
          "data": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "key": {
                  "type": "string",
                  "example": "bug_report_module"
                },
                "description": {
                  "type": "string"
                },
                "enabled": {
                  "type": "boolean"
                },
                "isOverridden": {
                  "type": "boolean"
                }
              }
            }
          }
        }
      }
order: 1000
