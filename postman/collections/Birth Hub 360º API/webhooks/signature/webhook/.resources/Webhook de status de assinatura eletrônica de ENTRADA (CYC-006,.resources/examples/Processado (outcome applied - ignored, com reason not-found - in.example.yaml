$kind: http-example
name: Processado (outcome applied | ignored, com reason not-found | invalid-transition quando ignored)
request:
  url: "{{baseUrl}}/webhooks/signature/webhook"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "provider": "govbr",
        "providerRequestId": "string",
        "status": "sent",
        "evidenceRef": "string"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
