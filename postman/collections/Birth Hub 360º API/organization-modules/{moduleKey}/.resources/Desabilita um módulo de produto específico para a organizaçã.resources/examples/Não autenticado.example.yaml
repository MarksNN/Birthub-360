$kind: http-example
request:
  url: "{{baseUrl}}/organization-modules/:moduleKey"
  method: DELETE
  headers:
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    moduleKey: string
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: ""
order: 3000
