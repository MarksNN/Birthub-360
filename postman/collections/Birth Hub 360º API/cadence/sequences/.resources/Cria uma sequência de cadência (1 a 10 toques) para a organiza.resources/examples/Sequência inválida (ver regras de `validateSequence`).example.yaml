$kind: http-example
request:
  url: "{{baseUrl}}/cadence/sequences"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "name": "string",
        "touches": [
          {
            "order": 1910,
            "channel": "whatsapp",
            "delayHoursFromPrevious": 80,
            "maxAttempts": 2,
            "templateRef": "string"
          }
        ]
      }
response:
  statusCode: 400
  statusText: Bad Request
  body:
    type: text
    content: ""
order: 2000
