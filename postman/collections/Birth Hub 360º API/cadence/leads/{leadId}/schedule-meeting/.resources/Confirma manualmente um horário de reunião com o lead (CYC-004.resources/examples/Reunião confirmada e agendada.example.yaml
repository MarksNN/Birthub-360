$kind: http-example
request:
  url: "{{baseUrl}}/cadence/leads/:leadId/schedule-meeting"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    leadId: string
  body:
    type: json
    content: |-
      {
        "proposedStart": "2012-06-30T00:00:34.116Z",
        "proposedEnd": "1981-03-22T00:24:15.324Z"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": "",
        "meta": {}
      }
    $type: |-
      {
        "description": "Envelope de resposta genérico usado pela maioria dos endpoints",
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "example": true
          },
          "meta": {
            "type": "object",
            "description": "Presente em listagens paginadas (page, limit, total, etc.)"
          }
        }
      }
order: 1000
