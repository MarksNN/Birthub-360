$kind: http-example
request:
  url: "{{baseUrl}}/agent-builder/proposals/:id/approve"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "notes": "string"
      }
response:
  statusCode: 409
  statusText: Conflict
  body:
    type: text
    content: ""
order: 4000
