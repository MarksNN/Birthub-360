$kind: http-example
request:
  url: "{{baseUrl}}/social-selling/approach/generate"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "targetCompany": "string",
        "targetRole": "string",
        "segment": "string",
        "triggerEvent": "string",
        "channel": "whatsapp",
        "tone": "provocative"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: ""
order: 3000
