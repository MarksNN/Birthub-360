$kind: http-example
request:
  url: "{{baseUrl}}/agents?activeOnly=false&jobRoleId=string"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  queryParams:
    - key: activeOnly
      value: "false"
      disabled: false
      description: 'Quando "false", inclui também agentes desativados. Default: true.'
    - key: jobRoleId
      value: string
      disabled: false
      description: Filtra pelo cargo principal do agente
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": "",
        "meta": {}
      }
    $type: |-
      {
        "description": "Envelope de resposta genérico usado pela maioria dos endpoints",
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "example": true
          },
          "meta": {
            "type": "object",
            "description": "Presente em listagens paginadas (page, limit, total, etc.)"
          }
        }
      }
order: 1000
