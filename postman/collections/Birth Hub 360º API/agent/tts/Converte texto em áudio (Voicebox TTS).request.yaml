$kind: http-request
description: ""
url: "{{baseUrl}}/agent/tts"
method: POST
headers:
  Content-Type: application/json
  Accept: audio/wav
body:
  type: json
  content: |-
    {
      "text": "string"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "text": {
          "type": "string",
          "minLength": 1,
          "maxLength": 2000
        }
      },
      "required": [
        "text"
      ]
    }
settings: {}
examples: ./.resources/Converte texto em áudio (Voicebox TTS).resources/examples
order: 1000
