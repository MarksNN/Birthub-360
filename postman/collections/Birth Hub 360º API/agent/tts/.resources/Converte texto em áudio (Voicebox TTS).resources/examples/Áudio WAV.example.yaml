$kind: http-example
request:
  url: "{{baseUrl}}/agent/tts"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: audio/wav
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "text": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: audio/wav
  body:
    type: text
    content: string
    $type: |-
      {
        "type": "string",
        "format": "binary"
      }
order: 1000
