$kind: http-example
name: OK — contrato pretendido; hoje nunca é retornado (ver 500).
request:
  url: "{{baseUrl}}/agent/audit-logs?agentType=string&action=string&result=error"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  queryParams:
    agentType: string
    action: string
    result: error
  body:
    type: text
    content: ""
