$kind: http-example
request:
  url: "{{baseUrl}}/agent/usage-heatmap?days=30"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  queryParams:
    - key: days
      value: "30"
      disabled: false
      description: "Janela em dias (default 30). O handler faz `parseInt` sem validação: o código não impõe limite superior (o único teto implícito é o intervalo válido de `Date`, ~1e8 dias), por isso nenhum `maximum` é documentado; `minimum: 1` reflete o uso coerente (0, negativo ou não numérico geram janela inválida/NaN)."
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": "",
        "meta": {}
      }
    $type: |-
      {
        "description": "Envelope de resposta genérico usado pela maioria dos endpoints",
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "example": true
          },
          "meta": {
            "type": "object",
            "description": "Presente em listagens paginadas (page, limit, total, etc.)"
          }
        }
      }
order: 1000
