$kind: http-example
request:
  url: "{{baseUrl}}/agent/golden-dataset/summary"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "summary": {},
        "toolUseValidation": {}
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "summary": {
            "type": "object"
          },
          "toolUseValidation": {
            "type": "object"
          }
        }
      }
order: 1000
