            "SDR",
            "BDR",
            "CLOSER",
            "CRM",
            "OPS",
            "SUPERVISOR"
          ]
        },
        "missionType": {
          "type": "string",
          "minLength": 1
        },
        "leadId": {
          "type": "string"
        },
        "leadScore": {
          "type": "number",
          "minimum": 0,
          "maximum": 100
        },
        "leadStage": {
          "type": "string"
        },
        "timeSinceLastContact": {
          "type": "number"
        },
        "previousAttempts": {
          "type": "integer",
          "minimum": 0
        }
