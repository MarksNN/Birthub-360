url: "{{baseUrl}}/agent/success-prediction"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "agentRole": "SDR",
      "missionType": "string",
      "leadId": "string",
      "leadScore": 48.88726423400822,
      "leadStage": "string",
      "timeSinceLastContact": 6339.766924830435,
      "previousAttempts": 1835
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "agentRole": {
          "type": "string",
