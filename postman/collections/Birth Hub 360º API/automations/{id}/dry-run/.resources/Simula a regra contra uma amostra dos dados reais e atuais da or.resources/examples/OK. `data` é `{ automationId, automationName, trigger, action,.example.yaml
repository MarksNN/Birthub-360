$kind: http-example
name: "OK. `data` é `{ automationId, automationName, trigger, action, enabled, generatedAt, sampleSize, matchedCount, wouldFireCount, methodologyNote, records: [{ entity: 'Lead'|'Activity', entityId, label, outcome: { action, wouldFire, blockedReason?, details } }] }`. `wouldFire` reflete o mesmo critério de bloqueio do motor real (janela comercial, opt-out, config inválida etc.) sem produzir nenhum efeito colateral."
request:
  url: "{{baseUrl}}/automations/:id/dry-run"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "limit": 9
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": "",
        "meta": {}
      }
    $type: |-
      {
        "description": "Envelope de resposta genérico usado pela maioria dos endpoints",
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "example": true
          },
          "meta": {
            "type": "object",
            "description": "Presente em listagens paginadas (page, limit, total, etc.)"
          }
        }
      }
order: 1000
