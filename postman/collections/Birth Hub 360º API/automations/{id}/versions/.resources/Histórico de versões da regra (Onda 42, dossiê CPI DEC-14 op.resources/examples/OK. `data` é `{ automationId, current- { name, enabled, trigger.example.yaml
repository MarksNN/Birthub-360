$kind: http-example
name: "OK. `data` é `{ automationId, current: { name, enabled, trigger, conditions, action, actionConfig }, currentUpdatedAt, history: [{ id, editedAt, editedByUserId, editedByEmail, changeReason: 'update'|'delete', snapshot: {...}, diffToNext: [{ field, before, after }] }] }`. `history` vazio quando a regra nunca foi editada desde a criação."
request:
  url: "{{baseUrl}}/automations/:id/versions"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: string
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": "",
        "meta": {}
      }
    $type: |-
      {
        "description": "Envelope de resposta genérico usado pela maioria dos endpoints",
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "example": true
          },
          "meta": {
            "type": "object",
            "description": "Presente em listagens paginadas (page, limit, total, etc.)"
          }
        }
      }
order: 1000
