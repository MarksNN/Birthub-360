$kind: http-example
name: Parecer técnico gerado. `data.sessionId` é `null` quando a avaliação foi gerada mas a persistência falhou (best-effort — a falha de banco não derruba um parecer já computado).
request:
  url: "{{baseUrl}}/intelligence/roleplay/finish"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "brand": "Birth Hub 360",
        "brandName": "string",
        "brandDescription": "string",
        "personaId": "string",
        "personaLabel": "string",
        "personaKey": "tech_director",
        "difficulty": "medio",
        "durationSeconds": 7718,
        "transcript": [
          {
            "sender": "bot",
            "text": "string"
          }
        ],
        "turnEvaluations": [
          {
            "clarity": 38,
            "objectionHandling": 73,
            "total": 26,
            "feedback": "string"
          },
          {
            "clarity": 20,
            "objectionHandling": 31,
            "total": 59,
            "feedback": "string"
          }
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": "",
        "meta": {}
      }
    $type: |-
      {
        "description": "Envelope de resposta genérico usado pela maioria dos endpoints",
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "example": true
          },
          "meta": {
            "type": "object",
            "description": "Presente em listagens paginadas (page, limit, total, etc.)"
          }
        }
      }
order: 1000
