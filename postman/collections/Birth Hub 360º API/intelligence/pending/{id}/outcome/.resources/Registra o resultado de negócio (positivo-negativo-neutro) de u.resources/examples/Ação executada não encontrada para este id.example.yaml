$kind: http-example
request:
  url: "{{baseUrl}}/intelligence/pending/:id/outcome"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "status": "POSITIVE",
        "notes": "string"
      }
response:
  statusCode: 404
  statusText: Not Found
  body:
    type: text
    content: ""
order: 2000
