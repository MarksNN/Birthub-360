$kind: http-example
name: question ausente ou fora do tamanho permitido (3–2000 caracteres)
request:
  url: "{{baseUrl}}/intelligence/suite/knowledge/copilot"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "question": "string",
        "userRole": "string"
      }
response:
  statusCode: 400
  statusText: Bad Request
  body:
    type: text
    content: ""
order: 2000
