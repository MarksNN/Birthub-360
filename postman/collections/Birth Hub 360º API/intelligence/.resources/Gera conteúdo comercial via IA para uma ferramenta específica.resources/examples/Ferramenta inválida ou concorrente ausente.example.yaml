$kind: http-example
request:
  url: "{{baseUrl}}/intelligence"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "tool": "string",
        "leadId": "string",
        "competitor": "string",
        "tone": "string",
        "objective": "string",
        "personaFallback": "string",
        "brandId": "birthhub360"
      }
response:
  statusCode: 400
  statusText: Bad Request
  body:
    type: text
    content: ""
order: 2000
