$kind: http-example
request:
  url: "{{baseUrl}}/intelligence/swarm/status"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "active": false,
          "lastRunAt": "1972-03-09T08:57:57.467Z",
          "nextRunAt": "1984-01-24T11:07:19.049Z",
          "organizationsCovered": 9172,
          "recommendationsCount": 351,
          "touchesDispatchedCount": 9696
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean"
          },
          "data": {
            "type": "object",
            "properties": {
              "active": {
                "type": "boolean"
              },
              "lastRunAt": {
                "type": "string",
                "format": "date-time"
              },
              "nextRunAt": {
                "type": "string",
                "format": "date-time"
              },
              "organizationsCovered": {
                "type": "integer"
              },
              "recommendationsCount": {
                "type": "integer"
              },
              "touchesDispatchedCount": {
                "type": "integer"
              }
            }
          }
        }
      }
order: 1000
