$kind: http-example
name: "Stream `text/event-stream`, terminando em `event: end`"
request:
  url: "{{baseUrl}}/intelligence/studio/stream"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: text/event-stream
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "brandKey": "Birth Hub 360",
        "inputs": {
          "question": "string"
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/event-stream
  body:
    type: text
    content: string
    $type: |-
      {
        "type": "string"
      }
order: 1000
