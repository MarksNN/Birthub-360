$kind: http-example
request:
  url: "{{baseUrl}}/intelligence/studio/stream"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "brandKey": "Birth Hub 360",
        "inputs": {
          "question": "string"
        }
      }
response:
  statusCode: 400
  statusText: Bad Request
  body:
    type: text
    content: ""
order: 2000
