$kind: http-example
request:
  url: "{{baseUrl}}/commercial-intelligence/export?format=json&month=string&owner=string"
  method: GET
  headers:
    - key: Accept
      value: text/csv
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  queryParams:
    format: json
    month: string
    owner: string
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: string
    $type: |-
      {
        "type": "string"
      }
order: 1000
