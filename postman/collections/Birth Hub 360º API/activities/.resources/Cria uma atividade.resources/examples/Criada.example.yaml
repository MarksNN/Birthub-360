      {
        "success": false,
        "data": {
          "type": "Tarefa",
          "owner": "string",
          "date": "2012-03-21",
          "leadId": "string",
          "id": "string",
          "organizationId": "string",
          "createdAt": "1955-05-29T04:52:40.388Z",
          "time": "string",
          "status": "Cancelada",
          "observations": "string"
        }
      }
