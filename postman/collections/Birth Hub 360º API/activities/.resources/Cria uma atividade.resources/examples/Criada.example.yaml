      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "type": "WhatsApp",
        "owner": "string",
        "date": "1989-02-12",
        "leadId": "string",
        "time": "string",
        "status": "Cancelada",
        "observations": "string"
      }
