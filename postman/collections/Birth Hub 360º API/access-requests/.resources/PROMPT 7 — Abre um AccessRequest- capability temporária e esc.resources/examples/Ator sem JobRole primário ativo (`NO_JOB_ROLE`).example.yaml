$kind: http-example
request:
  url: "{{baseUrl}}/access-requests"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "capabilityCode": "string",
        "resource": {},
        "reason": "string"
      }
response:
  statusCode: 409
  statusText: Conflict
  body:
    type: text
    content: ""
order: 4000
