$kind: http-example
request:
  url: "{{baseUrl}}/google/auth-url"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "url": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean"
          },
          "url": {
            "type": "string"
          }
        }
      }
order: 1000
