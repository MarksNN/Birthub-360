$kind: http-example
request:
  url: "{{baseUrl}}/leads/:leadId/attachments/upload-url"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    leadId: string
  body:
    type: json
    content: |-
      {
        "fileName": "string",
        "mimeType": "string",
        "sizeBytes": 2144
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "data": {
          "signedUrl": "string",
          "objectKey": "string",
          "fileName": "string",
          "mimeType": "string"
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean"
          },
          "data": {
            "type": "object",
            "properties": {
              "signedUrl": {
                "type": "string"
              },
              "objectKey": {
                "type": "string"
              },
              "fileName": {
                "type": "string"
              },
              "mimeType": {
                "type": "string"
              }
            }
          }
        }
      }
order: 1000
