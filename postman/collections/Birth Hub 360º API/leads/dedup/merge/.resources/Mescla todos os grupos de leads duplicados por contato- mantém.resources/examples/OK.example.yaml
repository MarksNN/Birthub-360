$kind: http-example
request:
  url: "{{baseUrl}}/leads/dedup/merge"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "data": {
          "merged": 5371
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean"
          },
          "data": {
            "type": "object",
            "properties": {
              "merged": {
                "type": "integer",
                "description": "Quantidade de leads duplicados removidos (soft-delete)"
              }
            }
          }
        }
      }
order: 1000
