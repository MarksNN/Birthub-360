$kind: http-example
request:
  url: "{{baseUrl}}/leads/export/csv"
  method: GET
  headers:
    - key: Accept
      value: text/csv
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/csv
  body:
    type: text
    content: string
    $type: |-
      {
        "type": "string",
        "format": "binary"
      }
order: 1000
