$kind: http-example
request:
  url: "{{baseUrl}}/integrations/ping"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "provider": "string",
        "token": "string",
        "apiKey": "string",
        "accessToken": "string",
        "domain": "string",
        "boardId": "string",
        "webhookUrl": "string",
        "config": {
          "key_0": 778,
          "key_1": 1932
        }
      }
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: ""
order: 3000
