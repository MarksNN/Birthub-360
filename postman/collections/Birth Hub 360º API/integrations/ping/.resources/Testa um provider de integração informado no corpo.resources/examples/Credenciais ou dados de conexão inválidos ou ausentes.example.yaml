$kind: http-example
request:
  url: "{{baseUrl}}/integrations/ping"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "provider": "string",
        "token": "string",
        "apiKey": "string",
        "accessToken": "string",
        "domain": "string",
        "boardId": "string",
        "webhookUrl": "string",
        "config": {
          "key_0": 778,
          "key_1": 1932
        }
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "error": "string",
        "valid": false
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              false
            ]
          },
          "valid": {
            "type": "boolean",
            "enum": [
              false
            ]
          },
          "error": {
            "type": "string"
          }
        },
        "required": [
          "success",
          "error"
        ]
      }
order: 2000
