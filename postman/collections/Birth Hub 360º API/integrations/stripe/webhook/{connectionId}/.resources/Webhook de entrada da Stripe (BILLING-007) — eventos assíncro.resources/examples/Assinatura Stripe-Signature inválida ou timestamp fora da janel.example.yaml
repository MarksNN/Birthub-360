$kind: http-example
name: Assinatura Stripe-Signature inválida ou timestamp fora da janela de tolerância
request:
  url: "{{baseUrl}}/integrations/stripe/webhook/:connectionId"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    connectionId: string
  body:
    type: json
    content: "{}"
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: ""
order: 3000
