$kind: http-example
request:
  url: "{{baseUrl}}/integrations/birth-voice/suppressions"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "phone": "string",
        "reason": "string",
        "leadId": "string"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean"
          }
        }
      }
order: 1000
