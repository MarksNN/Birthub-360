$kind: http-example
request:
  url: "{{baseUrl}}/integrations/external-crm/:id/test"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: string
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "valid": false,
        "message": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean"
          },
          "valid": {
            "type": "boolean"
          },
          "message": {
            "type": "string"
          }
        }
      }
order: 1000
