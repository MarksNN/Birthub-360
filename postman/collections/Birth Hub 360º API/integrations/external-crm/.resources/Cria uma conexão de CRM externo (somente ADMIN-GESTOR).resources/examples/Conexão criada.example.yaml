$kind: http-example
request:
  url: "{{baseUrl}}/integrations/external-crm"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "provider": "string",
        "label": "string",
        "config": {},
        "inboundEventsEnabled": true
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "string",
        "provider": "string",
        "label": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "provider": {
            "type": "string"
          },
          "label": {
            "type": "string"
          }
        }
      }
order: 1000
