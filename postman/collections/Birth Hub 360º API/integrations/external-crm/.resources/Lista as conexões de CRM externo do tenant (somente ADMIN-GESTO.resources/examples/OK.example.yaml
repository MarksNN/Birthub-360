$kind: http-example
request:
  url: "{{baseUrl}}/integrations/external-crm?provider=string"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  queryParams:
    - key: provider
      value: string
      disabled: false
      description: "Filtra por provider (ex.: hubspot, rdstation, monday)"
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: "[]"
    $type: |-
      {
        "type": "array",
        "items": {
          "type": "object"
        }
      }
order: 1000
