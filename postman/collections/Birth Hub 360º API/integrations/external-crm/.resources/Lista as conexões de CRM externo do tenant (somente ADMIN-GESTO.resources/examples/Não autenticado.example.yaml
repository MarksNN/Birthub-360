$kind: http-example
request:
  url: "{{baseUrl}}/integrations/external-crm?provider=string"
  method: GET
  headers:
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  queryParams:
    - key: provider
      value: string
      disabled: false
      description: "Filtra por provider (ex.: hubspot, rdstation, monday)"
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: ""
order: 2000
