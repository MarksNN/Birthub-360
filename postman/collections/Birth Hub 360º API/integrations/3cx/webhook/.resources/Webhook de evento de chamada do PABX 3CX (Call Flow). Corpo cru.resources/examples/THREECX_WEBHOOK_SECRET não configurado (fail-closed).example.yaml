$kind: http-example
request:
  url: "{{baseUrl}}/integrations/3cx/webhook"
  method: POST
  headers:
    - key: Content-Type
      value: application/octet-stream
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: file
    content: {}
response:
  statusCode: 503
  statusText: Service Unavailable
  body:
    type: text
    content: ""
order: 3000
