$kind: http-example
request:
  url: "{{baseUrl}}/module-access/:userId/:moduleKey"
  method: PUT
  headers:
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    userId: string
    moduleKey: string
  body:
    type: text
    content: ""
response:
  statusCode: 404
  statusText: Not Found
  body:
    type: text
    content: ""
order: 4000
