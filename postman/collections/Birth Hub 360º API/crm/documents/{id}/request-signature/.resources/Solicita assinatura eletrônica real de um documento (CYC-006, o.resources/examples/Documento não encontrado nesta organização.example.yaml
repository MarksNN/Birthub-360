$kind: http-example
request:
  url: "{{baseUrl}}/crm/documents/:id/request-signature"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "signerEmail": "emSTQFGglpDSj@xEWNIMobDBYvZnDZydpPcQORaXYBDL.emq",
        "signerName": "string"
      }
response:
  statusCode: 404
  statusText: Not Found
  body:
    type: text
    content: ""
order: 2000
