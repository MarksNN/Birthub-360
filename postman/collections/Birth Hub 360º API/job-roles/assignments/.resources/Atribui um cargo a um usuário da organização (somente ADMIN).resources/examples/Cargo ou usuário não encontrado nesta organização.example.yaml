$kind: http-example
request:
  url: "{{baseUrl}}/job-roles/assignments"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "userId": "string",
        "jobRoleId": "string",
        "isPrimary": true
      }
response:
  statusCode: 404
  statusText: Not Found
  body:
    type: text
    content: ""
order: 4000
