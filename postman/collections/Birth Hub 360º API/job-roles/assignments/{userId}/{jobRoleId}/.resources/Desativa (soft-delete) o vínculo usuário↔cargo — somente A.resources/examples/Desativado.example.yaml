$kind: http-example
request:
  url: "{{baseUrl}}/job-roles/assignments/:userId/:jobRoleId"
  method: DELETE
  headers:
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    userId: string
    jobRoleId: string
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean"
          }
        }
      }
order: 1000
