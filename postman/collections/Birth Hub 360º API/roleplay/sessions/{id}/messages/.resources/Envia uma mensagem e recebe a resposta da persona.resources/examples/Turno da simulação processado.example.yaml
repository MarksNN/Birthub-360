$kind: http-example
request:
  url: "{{baseUrl}}/roleplay/sessions/:id/messages"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "message": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "response": "string",
          "turnCount": 5183
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "example": true
          },
          "data": {
            "type": "object",
            "properties": {
              "response": {
                "type": "string"
              },
              "turnCount": {
                "type": "integer"
              }
            },
            "required": [
              "response",
              "turnCount"
            ]
          }
        },
        "required": [
          "success",
          "data"
        ]
      }
order: 1000
